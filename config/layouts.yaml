# Vertical (1080x1920) layouts per streamer. Coordinates are in the 1920x1080 source frame:
# [x, y, width, height].
#
# layout:
#   auto      - (default) split when a face is really inside `facecam` on the clip's frames,
#               otherwise fit_blur. `facecam` may be a list of boxes (cam moved): the one with
#               the face wins. Handles IRL / BRB / changed scenes automatically.
#   split     - always: webcam on top, gameplay below (the crop slides off the webcam unless
#               `content` is given).
#   fit_blur  - always: whole 16:9 frame in the middle, blurred zoomed copy as background.
# blur: rectangles blurred before cropping (sponsor/betting banners — required by programs).
#
# Facecams measured from live GTA VI recordings on 2026-11-18.

defaults:
  layout: auto
  content_zoom: 1.0            # fit_blur: >1 zooms the middle frame (crops sides)
  blur: []

streamers:
  buster:
    facecam: [0, 0, 490, 274]          # GTA scene: small cam top-left
    blur:
      - [1690, 0, 230, 620]            # right column: Winline / "получи бонусы" / RAMZES / promo plates
  zloyn:
    facecam:                           # zloyn moves the cam; auto picks the box with the face
      - [1460, 384, 460, 306]          # GTA, 2026-11-19: right side, lower
      - [1474, 200, 446, 336]          # GTA, 2026-11-18: right side, higher
  mokrivskyi:
    facecam: [0, 268, 432, 245]        # from an older VOD; outdoors/IRL scenes fall back to fit_blur
    blur:
      - [25, 130, 330, 110]            # PARI betting logo
  evelone2004:
    facecam: [0, 624, 420, 240]        # GTA marathon: LEFT cam (owner: confirm it is evelone)
