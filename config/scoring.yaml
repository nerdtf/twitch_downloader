# Stage-1 scoring (cheap, every stream second). Weights are initial guesses (see CLAUDE.md);
# tune only against gold/weak-gold with a held-out stream (python -m clipper.eval).

window_seconds: 10            # reaction window for chat counts
baseline_seconds: 600         # rolling baseline for z-scores (10 min)
chat_lag_seconds: 6           # chat reacts this long after the event (calibrated per streamer later)
audio_window_seconds: 5       # loudness peak window
audio_baseline_seconds: 30    # loudness baseline before the peak
z_cap: 6.0                    # z-scores above this count as "maximal"
family_threshold_z: 2.0       # a family "fires" above this z
agreement_single_family: 0.6  # multiplier when only one family fires (CLAUDE.md)

weights:                      # relative; normalised over the families available for a source
  # 2026-11-19: owner wants viewer clips to matter little; on 69 labels clips 0.45 -> 0.15 also
  # raised AUC 0.69 -> 0.73 (0.25: 0.75, 0: 0.69). Chat laughter decides.
  laugh: 0.62                 # laugh words over 20 s, vs this channel's usual rate
  hype: 0.15                  # wow / swearing / W / цц chant
  clips: 0.15                 # viewer clips made around the moment, vs this channel's usual rate
  audio: 0.08                 # loudness jump — tiebreaker only
  chat: 0.0                   # message rate: AUC 0.52 on labels (coin flip) — off

clip_window_seconds: 90       # count viewer clips created within this many seconds...
clip_offset_seconds: -15      # ...starting 15 s before the moment (keeps the peak on the moment)
reaction_window_seconds: 20   # laugh/hype counted over this window (10 s was noisier)
reaction_lag_seconds: 3

reaction_gate:                # score multiplier when chat does not laugh at the moment
  hype_only: 0.6              # chat reacts (wow/W) but nobody laughs
  no_reaction: 0.35           # neither laugh nor hype fires (replaces the agreement multiplier)
  # Owner: chat suddenly getting faster also marks a hype moment. As a scoring weight it hurt the
  # labels (AUC 0.72 -> 0.65-0.69); as a "chat reacted" signal here it is neutral on labels and
  # rescues epic/hype moments where chat explodes without laughing.
  speedup_is_reaction: true

min_score_per_streamer:       # overrides `pipeline live --min-score` (0.35) for small chats
  zloyn: 0.25                 # ~60 msgs/min vs 650 on evelone: ~8.6 moments/h instead of 7.3

warmup_seconds: 300           # no candidates in the first 5 min of a recording (stream-start hype)

penalties:
  copypasta_share: 0.5        # top identical message share above this -> penalty
  copypasta_penalty: 0.3
  notices_per_window: 5       # sub/raid bursts above this -> penalty
  notices_penalty: 0.2

peaks:
  smooth_seconds: 3
  min_gap_seconds: 90         # overlap gate: keep the higher of two peaks closer than this
  pre_roll_seconds: 25        # candidate window = [event - pre, event + post]
  post_roll_seconds: 12
  # Owner: when chat laughs long before/after, the clip must be longer. The window grows while
  # chat laugh+hype stays above mean + level*(reaction peak - mean); capped by max_*_roll.
  max_pre_roll_seconds: 50
  max_post_roll_seconds: 30
  extend: {level: 0.35, min_peak: 0.5, max_gap_seconds: 4, tail_seconds: 3, setup_seconds: 15}

# Twitch categories that are never clip material (owner, 2026-11-19: evelone's night stream ran
# SpongeBob under "I'm Only Sleeping" -> every clip was "streamer not main"). Case-insensitive.
skip_games:
  - "I'm Only Sleeping"
