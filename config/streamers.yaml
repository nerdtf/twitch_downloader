# Streamers to record. Add/remove entries here — no code changes needed.
# login: Twitch login (lowercase, as in twitch.tv/<login>)
# enabled: false keeps the entry but stops recording it
# quality / ttl_hours: optional per-streamer overrides of `defaults`

defaults:
  quality: "1080p60,1080p,best"   # comma list = fallback order (streamlink syntax)
  ttl_hours: 6                    # keep raw segments this long (live posting -> old video is stale)

recorder:
  data_dir: data/recordings
  db_path: data/clipper.db
  segment_seconds: 300
  helix_poll_seconds: 15          # Helix live check (needs TWITCH_CLIENT_ID/SECRET in .env)
  poll_seconds: 60                # fallback: try to open offline streams this often
  min_free_gb: 12                 # disk guard: delete oldest unpinned segments below this
  stall_seconds: 90               # restart pipeline if no bytes arrive for this long
  ttl_check_seconds: 600

streamers:
