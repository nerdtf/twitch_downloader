[project]
name = "clipper"
version = "0.1.0"
description = "Record Twitch streams, find clip-worthy moments, render vertical clips for review."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlink>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures (IRC lines, API payloads) read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
