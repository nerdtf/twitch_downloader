[project]
name = "clipper"
version = "0.1.0"
description = "Record Twitch streams, find clip-worthy moments, render vertical clips for review."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlink>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy modules stay untouched until they are replaced.
extend-exclude = [
    "ATRHandler.py", "atr_cmd.py", "cron_script.py", "daemon.py", "db_connection.py",
    "main.py", "streamConverter.py", "twitch.py", "utils.py", "watcher.py",
    "chatProcessing", "videoProcessing",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
