[project]
name = "clipper"
version = "0.1.0"
description = "Record Twitch streams, find clip-worthy moments, render vertical clips for review."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.5",
    "opencv-python-headless>=4.10,<5",
    "parakeet-mlx>=0.7.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlink>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # formatter wraps code at 100; long SQL/string literals may go to 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures (IRC lines, API payloads) read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
